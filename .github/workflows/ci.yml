name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: PHP ${{ matrix.php }} syntax check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all PHP files
        run: |
          set -e
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  test:
    name: PHPUnit on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-progress --no-interaction
      - name: Run unit tests
        run: vendor/bin/phpunit -c phpunit.xml.dist
      - name: Verify self-integrity manifest is current
        run: php bin/make-manifest.php --check

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    # Advisory for now: surfaces the report without blocking merges until
    # the baseline is fully clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-progress --no-interaction
      - name: Run PHPCS
        run: vendor/bin/phpcs
